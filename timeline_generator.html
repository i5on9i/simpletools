<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>타임라인 생성기</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0;
    padding: 24px;
    background: #f6f6f4;
    color: #222;
    line-height: 1.5;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { font-size: 13px; color: #777; margin-bottom: 20px; }
  .card {
    background: #fff;
    border: 1px solid #e0e0dc;
    border-radius: 8px;
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin: 0 0 12px; color: #444; }

  .event-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .event-row input[type="date"] {
    padding: 7px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
    width: 150px; font-family: inherit;
  }
  .event-row input[type="text"] {
    padding: 7px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px;
    flex: 1; font-family: inherit;
  }
  .event-row input[type="color"] {
    width: 34px; height: 32px; padding: 2px; border: 1px solid #ccc;
    border-radius: 4px; cursor: pointer;
  }
  .remove-btn {
    background: none; border: none; color: #b33; font-size: 15px; cursor: pointer;
    padding: 4px 8px; border-radius: 4px; line-height: 1;
  }
  .remove-btn:hover { background: #fbe9e9; }

  .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
  .btn {
    padding: 8px 14px; border: 1px solid #333; background: #fff; color: #222;
    border-radius: 5px; font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: #f0f0ee; }
  .btn-primary { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
  .btn-primary:hover { background: #333; }
  .btn-add { border-style: dashed; color: #555; }

  .toggle-label {
    display: flex; align-items: center; gap: 6px; font-size: 13px; color: #444;
    cursor: pointer; user-select: none; margin-left: auto;
  }

  .error { color: #b33; font-size: 13px; margin-top: 10px; display: none; }
  .copied-msg { color: #0f6e56; font-size: 13px; margin-left: 4px; display: none; }

  /* Timeline */
  #timelineSection { display: none; }
  #timelineSection h2 { font-size: 14px; font-weight: 600; color: #444; margin-bottom: 12px; }
  #timelineWrap {
    display: flex; gap: 10px; align-items: stretch;
  }
  #timelineScroll {
    flex: 1; overflow-y: auto; max-height: 70vh; position: relative;
    border: 1px solid #e0e0dc; border-radius: 8px; background: #fff;
    padding: 40px 0;
  }
  #timelineInner { position: relative; width: 100%; }
  .center-line {
    position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
    background: #ddd; transform: translateX(-50%);
  }
  .event-dot {
    position: absolute; left: 50%; width: 10px; height: 10px;
    background: #0f6e56; border-radius: 50%; transform: translate(-50%, -50%);
    border: 2px solid #fff; box-shadow: 0 0 0 1px #0f6e56;
  }
  .event-label {
    position: absolute; width: 220px; transform: translateY(-50%);
    font-size: 13px; padding: 6px 10px; background: #f2f7f4;
    border: 1px solid #d9e8e0; border-radius: 6px;
  }
  .event-label .date { font-weight: 600; font-size: 12px; color: #0f6e56; margin-bottom: 2px; }
  .event-label .content { color: #333; word-break: break-word; }
  .event-label.left { right: calc(50% + 20px); text-align: right; }
  .event-label.right { left: calc(50% + 20px); text-align: left; }

  /* rotated (vertical writing) mode - compact horizontal footprint,
     read normally when device is rotated to landscape */
  #timelineInner.rotated .event-label {
    width: auto; max-height: 220px; writing-mode: vertical-rl; text-orientation: sideways;
    text-align: left; padding: 10px 6px;
  }
  #timelineInner.rotated .event-label.left { right: calc(50% + 20px); }
  #timelineInner.rotated .event-label.right { left: calc(50% + 20px); }
  #timelineInner.rotated .event-label .date { margin-bottom: 0; margin-right: 4px; }

  /* Minimap */
  #minimap {
    width: 46px; flex-shrink: 0; position: relative;
    border: 1px solid #e0e0dc; border-radius: 8px; background: #fafaf8;
  }
  .mini-line {
    position: absolute; left: 50%; top: 6px; bottom: 6px; width: 1px;
    background: #ddd; transform: translateX(-50%);
  }
  .mini-dot {
    position: absolute; left: 50%; width: 6px; height: 6px; border-radius: 50%;
    background: #0f6e56; transform: translate(-50%, -50%); cursor: pointer;
  }
  .mini-viewport {
    position: absolute; left: 3px; right: 3px;
    background: rgba(15, 110, 86, 0.12); border: 1px solid rgba(15, 110, 86, 0.5);
    border-radius: 3px; pointer-events: none;
  }
</style>
</head>
<body>
<div class="container">
  <h1>타임라인 생성기</h1>
  <div class="subtitle">이벤트를 입력하고 세로형 타임라인을 생성하세요. 링크로 공유할 수 있습니다.</div>

  <div class="card">
    <h2>이벤트 입력</h2>
    <div id="eventRows"></div>
    <div class="toolbar">
      <button class="btn btn-add" onclick="addRow()">+ 이벤트 추가</button>
      <button class="btn btn-primary" onclick="generateTimeline()">생성</button>
      <button class="btn" onclick="copyLink()">🔗 링크 복사</button>
      <span class="copied-msg" id="copiedMsg">복사됨!</span>
      <label class="toggle-label">
        <input type="checkbox" id="rotateToggle" onchange="applyRotation()">
        라벨 세로쓰기 (기기를 가로로 돌려서 보기)
      </label>
    </div>
    <div class="error" id="errorMsg"></div>
  </div>

  <div class="card" id="timelineSection">
    <h2>타임라인</h2>
    <div id="timelineWrap">
      <div id="timelineScroll">
        <div id="timelineInner"></div>
      </div>
      <div id="minimap"></div>
    </div>
  </div>
</div>

<script>
let rowId = 0;
const COLOR_PALETTE = ['#0f6e56', '#185fa5', '#993c1d', '#993556', '#854f0b', '#533dab'];

function addRow(date = '', label = '', color = '') {
  const id = 'row' + (rowId++);
  const defaultColor = color || COLOR_PALETTE[rowId % COLOR_PALETTE.length];
  const rows = document.getElementById('eventRows');
  const row = document.createElement('div');
  row.className = 'event-row';
  row.id = id;
  row.innerHTML = `
    <input type="date" value="${date}">
    <input type="text" placeholder="내용" value="${escapeAttr(label)}">
    <input type="color" value="${defaultColor}" title="이벤트 색상">
    <button class="remove-btn" onclick="removeRow('${id}')">✕</button>
  `;
  rows.appendChild(row);
}

function removeRow(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function escapeAttr(str) {
  return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}
function escapeHtml(str) {
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function getEvents() {
  const rows = document.querySelectorAll('.event-row');
  const events = [];
  rows.forEach(row => {
    const date = row.querySelector('input[type="date"]').value;
    const label = row.querySelector('input[type="text"]').value.trim();
    const color = row.querySelector('input[type="color"]').value;
    if (date && label) events.push({ d: date, l: label, c: color });
  });
  return events;
}

function showError(msg) {
  const el = document.getElementById('errorMsg');
  if (msg) { el.textContent = msg; el.style.display = 'block'; }
  else { el.style.display = 'none'; }
}

function computeLayout(events) {
  const PADDING = 50;
  const MIN_SPACING = 90;
  const times = events.map(e => new Date(e.d).getTime());
  const minT = Math.min(...times);
  const maxT = Math.max(...times);
  const totalDays = (maxT - minT) / 86400000;

  let positions;
  if (totalDays <= 0) {
    positions = events.map((_, i) => PADDING + i * MIN_SPACING);
  } else {
    let minGapDays = Infinity;
    for (let i = 1; i < times.length; i++) {
      const diff = (times[i] - times[i - 1]) / 86400000;
      if (diff > 0) minGapDays = Math.min(minGapDays, diff);
    }
    if (!isFinite(minGapDays)) minGapDays = totalDays;
    const scale = MIN_SPACING / minGapDays;
    positions = times.map(t => PADDING + ((t - minT) / 86400000) * scale);
  }
  const height = positions[positions.length - 1] + PADDING;
  return { positions, height };
}

function generateTimeline() {
  showError('');
  let events = getEvents();
  if (events.length < 2) {
    showError('날짜와 내용을 모두 입력한 이벤트가 최소 2개 필요합니다.');
    document.getElementById('timelineSection').style.display = 'none';
    return;
  }
  events.sort((a, b) => new Date(a.d) - new Date(b.d));

  const { positions, height } = computeLayout(events);
  const inner = document.getElementById('timelineInner');
  inner.innerHTML = '';
  inner.style.height = height + 'px';

  const centerLine = document.createElement('div');
  centerLine.className = 'center-line';
  inner.appendChild(centerLine);

  events.forEach((ev, i) => {
    const side = i % 2 === 0 ? 'left' : 'right';
    const top = positions[i];

    const color = ev.c || '#0f6e56';

    const dot = document.createElement('div');
    dot.className = 'event-dot';
    dot.style.top = top + 'px';
    dot.style.background = color;
    dot.style.boxShadow = `0 0 0 1px ${color}`;
    inner.appendChild(dot);

    const label = document.createElement('div');
    label.className = 'event-label ' + side;
    label.style.top = top + 'px';
    label.style.borderColor = color;
    label.innerHTML = `<div class="date" style="color:${color}">${escapeHtml(ev.d)}</div><div class="content">${escapeHtml(ev.l)}</div>`;
    inner.appendChild(label);
  });

  applyRotation();
  document.getElementById('timelineSection').style.display = 'block';
  renderMinimap(events, positions, height);
}

function applyRotation() {
  const inner = document.getElementById('timelineInner');
  const on = document.getElementById('rotateToggle').checked;
  inner.classList.toggle('rotated', on);
}

/* ---- Minimap ---- */
function renderMinimap(events, positions, contentHeight) {
  const minimap = document.getElementById('minimap');
  const scrollBox = document.getElementById('timelineScroll');
  minimap.innerHTML = '';

  const line = document.createElement('div');
  line.className = 'mini-line';
  minimap.appendChild(line);

  const viewport = document.createElement('div');
  viewport.className = 'mini-viewport';
  minimap.appendChild(viewport);

  const mapH = minimap.clientHeight;

  positions.forEach((pos, i) => {
    const dot = document.createElement('div');
    dot.className = 'mini-dot';
    dot.style.top = ((pos / contentHeight) * mapH) + 'px';
    dot.style.background = (events[i] && events[i].c) || '#0f6e56';
    dot.onclick = () => {
      const targetTop = (pos / contentHeight) * scrollBox.scrollHeight - scrollBox.clientHeight / 2;
      scrollBox.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
    };
    minimap.appendChild(dot);
  });

  function updateViewport() {
    const ratioTop = scrollBox.scrollTop / scrollBox.scrollHeight;
    const ratioH = scrollBox.clientHeight / scrollBox.scrollHeight;
    viewport.style.top = (ratioTop * mapH) + 'px';
    viewport.style.height = Math.max(6, ratioH * mapH) + 'px';
  }
  scrollBox.onscroll = updateViewport;
  updateViewport();

  minimap.onclick = (e) => {
    if (e.target !== minimap && e.target !== line) return;
    const rect = minimap.getBoundingClientRect();
    const frac = (e.clientY - rect.top) / rect.height;
    const targetTop = frac * scrollBox.scrollHeight - scrollBox.clientHeight / 2;
    scrollBox.scrollTo({ top: Math.max(0, targetTop), behavior: 'smooth' });
  };
}

/* ---- URL sharing ---- */
function copyLink() {
  const events = getEvents();
  if (events.length === 0) {
    showError('공유할 이벤트를 먼저 입력하세요.');
    return;
  }
  const url = new URL(window.location.href);
  url.search = '';
  url.searchParams.set('events', JSON.stringify(events));
  navigator.clipboard.writeText(url.toString()).then(() => {
    const msg = document.getElementById('copiedMsg');
    msg.style.display = 'inline';
    setTimeout(() => { msg.style.display = 'none'; }, 1800);
  }).catch(() => {
    showError('클립보드 복사에 실패했습니다. 브라우저 권한을 확인하세요.');
  });
}

function loadFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const raw = params.get('events');
  if (!raw) return false;
  try {
    const events = JSON.parse(raw);
    if (!Array.isArray(events) || events.length === 0) return false;
    document.getElementById('eventRows').innerHTML = '';
    events.forEach(ev => addRow(ev.d || '', ev.l || '', ev.c || ''));
    return true;
  } catch (e) {
    return false;
  }
}

/* ---- init ---- */
window.addEventListener('DOMContentLoaded', () => {
  const loaded = loadFromUrl();
  if (!loaded) {
    for (let i = 0; i < 3; i++) addRow();
  } else {
    generateTimeline();
  }
});
</script>
</body>
</html>
